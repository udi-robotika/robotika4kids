name: scrape
on:
  push:
    paths: ["tools/scrape.py", ".github/workflows/scrape.yml"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/scrape.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add raw && git commit -m "scrape" && git push
