name: scrape
on:
  push:
    paths: ["tools/scrape.py", "tools/fix_missing.py", ".github/workflows/scrape.yml"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: if git diff --name-only HEAD~1 | grep -q fix_missing; then python3 tools/fix_missing.py; else python3 tools/scrape.py; fi
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add raw && git commit -m "scrape" && git push
